<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;">
<title>fr_exercices_pack_v2 — Connexion</title>
<style>
:root{--brand:#2b5;--ink:#222;--muted:#666;--bg:#f7f7f7;--card:#fff}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{background:var(--card);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.1);padding:32px;max-width:400px;width:100%;margin:16px}
h1{margin:0 0 8px;font-size:1.6rem;color:var(--brand)}
.subtitle{color:var(--muted);margin-bottom:24px;font-size:.95rem}
.form-group{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-weight:600;color:var(--ink)}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:1rem;box-sizing:border-box}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,187,85,.1)}
button{width:100%;border:0;padding:14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:1rem;transition:all .2s;background:var(--brand);color:#fff;margin-top:8px}
button:hover{opacity:.9}
.info-box{background:#f0f8ff;border:1px solid #cde;border-radius:10px;padding:14px;margin-bottom:20px;font-size:.9rem;color:#333}
</style>
</head>
<body>
<div class="container">
  <h1>Entraînement au français - <em>espace numérique</em></h1>
  <p class="subtitle">Sélectionnez votre profil</p>

  <div class="info-box">
    Version de démonstration : choisissez simplement votre nom et rôle pour accéder à la plateforme.
  </div>

  <div class="form-group">
    <label for="userName">Votre nom</label>
    <input type="text" id="userName" placeholder="ex. Jean Dupont" required>
  </div>

  <div class="form-group">
    <label for="userRole">Votre rôle</label>
    <select id="userRole">
      <option value="student">Étudiant - Accès aux exercices</option>
      <option value="admin">Administrateur - Gestion complète</option>
    </select>
  </div>

  <button id="enterBtn">Entrer sur la plateforme</button>
</div>

<script>
const AUTH_KEY = 'fr_auth_user';

document.getElementById('enterBtn').addEventListener('click', () => {
  const name = document.getElementById('userName').value.trim();
  const role = document.getElementById('userRole').value;
  
  if (!name) {
    alert('Veuillez entrer votre nom');
    return;
  }
  
  const user = {
    id: 'user_' + Date.now(),
    name: name,
    role: role,
    loginTime: new Date().toISOString()
  };
  
  localStorage.setItem(AUTH_KEY, JSON.stringify(user));
  
  if (role === 'admin') {
    window.location.href = 'admin.html';
  } else {
    window.location.href = 'dashboard.html';
  }
});

// Handle Enter key
document.getElementById('userName').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('enterBtn').click();
  }
});

// Check if already logged in
const currentUser = localStorage.getItem(AUTH_KEY);
if (currentUser) {
  try {
    const user = JSON.parse(currentUser);
    if (user.role === 'admin') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'dashboard.html';
    }
  } catch (e) {
    localStorage.removeItem(AUTH_KEY);
  }
}
</script>
</body>
</html>
