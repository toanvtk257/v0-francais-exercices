<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;">
<title>fr_exercices_pack_v2 — Connexion</title>
<style>
:root{--brand:#2b5;--ink:#222;--muted:#666;--bg:#f7f7f7;--card:#fff}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{background:var(--card);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.1);padding:32px;max-width:400px;width:100%;margin:16px}
h1{margin:0 0 8px;font-size:1.6rem;color:var(--brand)}
.subtitle{color:var(--muted);margin-bottom:24px;font-size:.95rem}
.form-group{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-weight:600;color:var(--ink)}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:1rem;box-sizing:border-box}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,187,85,.1)}
button{width:100%;border:0;padding:14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:1rem;transition:all .2s;background:var(--brand);color:#fff;margin-top:8px}
button:hover{opacity:.9}
.error{color:#c33;font-size:.9rem;margin-top:8px;display:none}
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tab{flex:1;padding:12px;border:0;background:#f0f0f0;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
.tab.active{background:var(--brand);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
.link{text-align:center;margin-top:16px;font-size:.9rem}
.link a{color:var(--brand);text-decoration:none}
.link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
  <h1>Entraînement au français - <em>espace numérique</em></h1>
  <p class="subtitle">Connexion à la plateforme</p>

  <!-- Added tabs for Login and Register -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Connexion</button>
    <button class="tab" onclick="switchTab('register')">Inscription</button>
  </div>

  <!-- Login form with email and password -->
  <div id="login-tab" class="tab-content active">
    <div class="form-group">
      <label for="login-email">Email ou ID étudiant</label>
      <input type="text" id="login-email" autocomplete="off" placeholder="votre.email@exemple.fr">
    </div>

    <div class="form-group">
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" autocomplete="off" placeholder="••••••••">
    </div>

    <button type="button" onclick="handleLogin()">Connexion</button>
    <div id="login-error" class="error"></div>
  </div>

  <!-- Register form with name, email, password and role -->
  <div id="register-tab" class="tab-content">
    <div class="form-group">
      <label for="register-name">Nom complet</label>
      <input type="text" id="register-name" autocomplete="off" placeholder="Jean Dupont">
    </div>

    <div class="form-group">
      <label for="register-email">Email</label>
      <input type="email" id="register-email" autocomplete="off" placeholder="jean.dupont@exemple.fr">
    </div>

    <div class="form-group">
      <label for="register-password">Mot de passe</label>
      <input type="password" id="register-password" autocomplete="off" placeholder="••••••••">
    </div>

    <div class="form-group">
      <label for="register-role">Rôle</label>
      <select id="register-role">
        <option value="student">Étudiant - Accès aux exercices</option>
        <option value="admin">Administrateur - Gestion complète</option>
      </select>
    </div>

    <button type="button" onclick="handleRegister()">S'inscrire</button>
    <div id="register-error" class="error"></div>
  </div>
</div>

<!-- Added proper authentication with localStorage -->
<script>
function switchTab(tab) {
  const loginTab = document.getElementById('login-tab');
  const registerTab = document.getElementById('register-tab');
  const tabs = document.querySelectorAll('.tab');
  
  tabs.forEach(t => t.classList.remove('active'));
  
  if (tab === 'login') {
    loginTab.classList.add('active');
    registerTab.classList.remove('active');
    tabs[0].classList.add('active');
  } else {
    registerTab.classList.add('active');
    loginTab.classList.remove('active');
    tabs[1].classList.add('active');
  }
  
  // Clear errors
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('register-error').style.display = 'none';
}

function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorDiv = document.getElementById('login-error');
  
  if (!email || !password) {
    errorDiv.textContent = 'Veuillez remplir tous les champs';
    errorDiv.style.display = 'block';
    return;
  }
  
  // Get stored users
  const users = JSON.parse(localStorage.getItem('fr_users') || '{}');
  const user = users[email];
  
  if (!user || user.password !== password) {
    errorDiv.textContent = 'Email ou mot de passe incorrect';
    errorDiv.style.display = 'block';
    return;
  }
  
  // Store authentication data
  const userData = {
    id: user.id,
    name: user.name,
    email: user.email,
    role: user.role
  };
  localStorage.setItem('fr_auth_user', JSON.stringify(userData));
  localStorage.setItem('fr_current_user', user.id);
  
  // Navigate based on role
  window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
}

function handleRegister() {
  const name = document.getElementById('register-name').value.trim();
  const email = document.getElementById('register-email').value.trim();
  const password = document.getElementById('register-password').value;
  const role = document.getElementById('register-role').value;
  const errorDiv = document.getElementById('register-error');
  
  if (!name || !email || !password) {
    errorDiv.textContent = 'Veuillez remplir tous les champs';
    errorDiv.style.display = 'block';
    return;
  }
  
  // Get existing users
  const users = JSON.parse(localStorage.getItem('fr_users') || '{}');
  
  // Check if user already exists
  if (users[email]) {
    errorDiv.textContent = 'Cet email est déjà enregistré';
    errorDiv.style.display = 'block';
    return;
  }
  
  // Create new user
  const userId = 'user_' + Date.now();
  users[email] = {
    id: userId,
    name: name,
    email: email,
    password: password,
    role: role
  };
  
  // Save to localStorage
  localStorage.setItem('fr_users', JSON.stringify(users));
  
  // Auto-login after registration
  const userData = {
    id: userId,
    name: name,
    email: email,
    role: role
  };
  localStorage.setItem('fr_auth_user', JSON.stringify(userData));
  localStorage.setItem('fr_current_user', userId);
  
  // Navigate based on role
  window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
}

// Allow Enter key to submit
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('login-password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleLogin();
  });
  
  document.getElementById('register-role').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleRegister();
  });
});
</script>
</body>
</html>
