<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion - Entraînement au français</title>
<link rel="stylesheet" href="css/style.css">
<!-- Load Supabase from CDN before our client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    console.log('[v0] Supabase CDN loaded:', typeof window.supabase);
</script>
<!-- Load config.js before supabase-client.js -->
<script src="lib/config.js?v=20260613"></script>
<!-- Load device fingerprinting library -->
<script src="lib/device-fingerprint.js"></script>
<script src="lib/supabase-client.js?v=20260613"></script>
<style>
:root{--brand:#2b5;--ink:#222;--muted:#666;--bg:#f7f7f7;--card:#fff}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{background:var(--card);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.1);padding:32px;max-width:400px;width:100%;margin:16px}
h1{margin:0 0 8px;font-size:1.6rem;color:var(--brand)}
.subtitle{color:var(--muted);margin-bottom:24px;font-size:.95rem}
.form-group{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-weight:600;color:var(--ink)}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:1rem;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,187,85,.1)}
button{width:100%;border:0;padding:14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:1rem;transition:all .2s;background:var(--brand);color:#fff;margin-top:8px}
button:hover{opacity:.9}
button:disabled{background:#ccc;cursor:not-allowed}
.error{color:#c33;font-size:.9rem;margin-top:8px;display:none}
.success{color:#2b5;font-size:.9rem;margin-top:8px;display:none}
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tab{flex:1;padding:12px;border:0;background:#f0f0f0;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
.tab.active{background:var(--brand);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
.pin-input{text-align:center;font-size:1.5rem;letter-spacing:8px;font-weight:600;-webkit-text-security:disc}
.info-box{background:#e8f5e9;border-left:4px solid var(--brand);padding:12px;margin-bottom:16px;border-radius:6px;font-size:.9rem;color:var(--ink)}
.required{color:#c33}
.loading{display:none;text-align:center;padding:20px}
.loading.active{display:block}
.spinner{border:3px solid #f3f3f3;border-top:3px solid var(--brand);border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <h1>Entraînement au français - <em>espace numérique</em></h1>
  <p class="subtitle">Connexion à la plateforme</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Connexion</button>
    <button class="tab" onclick="switchTab('signup')">Inscription</button>
  </div>

  <!-- Loading indicator -->
  <div id="loadingIndicator" class="loading">
    <div class="spinner"></div>
    <p>Chargement...</p>
  </div>

  <!-- Login Form -->
  <div id="login" class="tab-content active">
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email <span class="required">*</span></label>
        <input type="email" id="loginEmail" placeholder="votre@email.com" required>
      </div>
      <div class="form-group">
        <label for="loginPin">Code PIN (6 chiffres) <span class="required">*</span></label>
        <input type="password" id="loginPin" class="pin-input" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
      </div>
      <div id="loginError" class="error"></div>
      <button type="submit" id="loginBtn">Se connecter</button>
    </form>
  </div>

  <!-- Signup Form -->
  <div id="signup" class="tab-content">
    <div class="info-box">
      Votre inscription sera soumise à l'approbation d'un administrateur. Vous serez contacté par téléphone une fois votre demande traitée.
    </div>
    <form id="signupForm" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="signupName">Nom complet <span class="required">*</span></label>
        <input type="text" id="signupName" placeholder="Votre nom" required>
      </div>
      <div class="form-group">
        <label for="signupEmail">Email <span class="required">*</span></label>
        <input type="email" id="signupEmail" placeholder="votre@email.com" required>
      </div>
      <div class="form-group">
        <label for="signupPin">Code PIN (6 chiffres) <span class="required">*</span></label>
        <input type="password" id="signupPin" class="pin-input" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
      </div>
      
      <!-- Adding admin account creation option -->
      <div class="form-group">
        <label for="accountType">Type de compte</label>
        <select id="accountType" onchange="toggleAdminFields()">
          <option value="student">Étudiant (avec approbation)</option>
          <option value="admin">Administrateur (code secret requis)</option>
        </select>
      </div>
      
      <div id="adminSecretField" class="form-group" style="display:none;">
        <label for="adminSecret">Code secret administrateur <span class="required">*</span></label>
        <input type="password" id="adminSecret" placeholder="Code secret admin">
        <small style="color: var(--muted); font-size: 0.85rem;">Contactez un administrateur pour obtenir le code secret</small>
      </div>
      
      <div id="studentFields">
        <div class="form-group">
          <label for="signupFiliere">Filière / Institut <span class="required">*</span></label>
          <select id="signupFiliere" required>
            <option value="">-- Sélectionner --</option>
            <option value="Idécaf">Idécaf</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label for="signupZalo">Numéro de téléphone <span class="required">*</span></label>
          <input type="tel" id="signupZalo" placeholder="Votre numéro de téléphone" required>
        </div>
      </div>
      
      <div id="signupError" class="error"></div>
      <div id="signupSuccess" class="success"></div>
      <button type="submit" id="signupBtn">Soumettre la demande</button>
    </form>
  </div>
</div>

<script>
// Tab switching
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    document.querySelector(`.tab:nth-child(${tab === 'login' ? 1 : 2})`).classList.add('active');
    document.getElementById(tab).classList.add('active');
    
    // Clear errors
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('signupError').style.display = 'none';
    document.getElementById('signupSuccess').style.display = 'none';
}

// Show/hide loading
function setLoading(show) {
    document.getElementById('loadingIndicator').classList.toggle('active', show);
    document.querySelectorAll('form').forEach(f => f.style.display = show ? 'none' : 'block');
}

async function handleLogin(event) {
    event.preventDefault();
    
    const email = document.getElementById('loginEmail').value.trim();
    const pin = document.getElementById('loginPin').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    
    console.log('[v0] Login form submitted:', { email, pinLength: pin.length });
    
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Connexion en cours...';
    
    try {
        // Check if Supabase is available
        if (!window.SupabaseDB || !window.SupabaseDB.isAvailable()) {
            console.error('[v0] SupabaseDB not available');
            throw new Error('Base de données non disponible. Veuillez réessayer.');
        }
        
        console.log('[v0] Calling SupabaseDB.login...');
        const user = await window.SupabaseDB.login(email, pin);
        console.log('[v0] Login successful, user role:', user.role);
        
        if (user.suspended) {
            throw new Error('ACCOUNT_SUSPENDED');
        }
        
        // Redirect based on role
        if (user.role === 'admin') {
            window.location.href = 'admin.html';
        } else {
            window.location.href = 'dashboard.html';
        }
    } catch (error) {
        console.error('[v0] Login error:', error);
        
        if (error.message === 'ACCOUNT_SUSPENDED') {
            errorEl.innerHTML = `
                <strong>Compte suspendu</strong><br>
                Votre compte a été suspendu par un administrateur. 
                Si vous souhaitez réactiver votre compte, veuillez contacter l'administrateur par téléphone.
            `;
        } else if (error.message === 'DEVICE_LIMIT_REACHED') {
            errorEl.innerHTML = `
                <strong>Trop d'appareils détectés!</strong><br>
                Vous utilisez déjà 2 appareils différents. Pour vous connecter depuis ce nouvel appareil, 
                vous devez d'abord supprimer un ancien appareil depuis votre tableau de bord (onglet "Mes Appareils").
                <br><br>
                <strong>Note:</strong> Les appareils sont verrouillés pendant 7 jours après leur ajout et ne peuvent pas être supprimés pendant cette période.
                <br><br>
                <em>Cette limitation empêche le partage de compte entre étudiants.</em>
            `;
        } else if (error.message === 'REJECTED_REGISTRATION') {
            errorEl.textContent = 'Votre compte n\'a pas été créé. L\'administrateur a refusé votre demande d\'inscription.';
        } else {
            errorEl.textContent = error.message || 'Email ou PIN incorrect';
        }
        
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
    }
}

async function handleSignup(event) {
    event.preventDefault();
    
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const pin = document.getElementById('signupPin').value;
    const accountType = document.getElementById('accountType').value;
    const adminSecret = document.getElementById('adminSecret').value;
    const filiere = document.getElementById('signupFiliere').value;
    const zalo = document.getElementById('signupZalo').value.trim();
    
    const errorEl = document.getElementById('signupError');
    const successEl = document.getElementById('signupSuccess');
    const btn = document.getElementById('signupBtn');
    
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
    
    // Validate PIN
    if (pin.length !== 6 || !/^\d{6}$/.test(pin)) {
        errorEl.textContent = 'Le code PIN doit contenir exactement 6 chiffres';
        errorEl.style.display = 'block';
        return;
    }
    
    if (accountType === 'admin') {
        // Validate admin secret (hardcoded for now, should be in environment variable in production)
        const ADMIN_SECRET = 'ADMIN2025';
        
        if (adminSecret !== ADMIN_SECRET) {
            errorEl.textContent = 'Code secret administrateur incorrect';
            errorEl.style.display = 'block';
            return;
        }
        
        btn.disabled = true;
        btn.textContent = 'Création du compte...';
        
        try {
            if (!window.SupabaseDB || !window.SupabaseDB.isAvailable()) {
                throw new Error('Base de données non disponible. Veuillez réessayer.');
            }
            
            // Create admin account directly
            await window.SupabaseDB.createAdminAccount({
                name,
                email,
                pin
            });
            
            successEl.textContent = 'Compte administrateur créé avec succès! Vous pouvez maintenant vous connecter.';
            successEl.style.display = 'block';
            
            // Reset form and switch to login tab after 2 seconds
            setTimeout(() => {
                document.getElementById('signupForm').reset();
                switchTab('login');
            }, 2000);
            
        } catch (error) {
            console.error('[v0] Admin signup error:', error);
            if (error.message.includes('duplicate') || error.message.includes('unique')) {
                errorEl.textContent = 'Cet email est déjà utilisé.';
            } else {
                errorEl.textContent = error.message || 'Erreur lors de la création du compte. Veuillez réessayer.';
            }
            errorEl.style.display = 'block';
        }
        
        btn.disabled = false;
        btn.textContent = 'Créer le compte admin';
        return;
    }
    
    // Student registration request
    btn.disabled = true;
    
    try {
        if (!window.SupabaseDB || !window.SupabaseDB.isAvailable()) {
            throw new Error('Base de données non disponible. Veuillez réessayer.');
        }
        
        // Check if email already exists
        const emailCheck = await window.SupabaseDB.checkEmailExists(email);
        
        if (emailCheck.exists) {
            let message = 'Cet email ne peut pas être utilisé. ';
            if (emailCheck.existsInRequests && emailCheck.requestStatus === 'pending') {
                message += 'Une demande d\'inscription est déjà en attente de traitement pour cet email.';
            } else if (emailCheck.existsInRequests && emailCheck.requestStatus === 'rejected') {
                message += 'Une demande d\'inscription a été refusée pour cet email. Veuillez utiliser un autre email ou contacter l\'administrateur.';
            } else if (emailCheck.existsInUsers) {
                message += 'Un compte existe déjà avec cet email.';
            } else {
                message += 'Veuillez utiliser un autre email.';
            }
            
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Soumettre la demande';
            return;
        }
        
        btn.textContent = 'Envoi en cours...';
        
        await window.SupabaseDB.createRegistrationRequest({
            name,
            email,
            pin,
            filiere,
            zalo
        });
        
        document.getElementById('signupForm').reset();
        
        successEl.textContent = 'Votre demande a été soumise avec succès! Un administrateur examinera votre demande et vous contactera par téléphone.';
        successEl.style.display = 'block';
        
        setTimeout(() => {
            successEl.style.display = 'none';
        }, 5000);
        
    } catch (error) {
        console.error('[v0] Signup error:', error);
        if (error.message.includes('duplicate') || error.message.includes('unique')) {
            errorEl.textContent = 'Cet email est déjà utilisé. Veuillez utiliser un autre email.';
        } else {
            errorEl.textContent = error.message || 'Erreur lors de la soumission. Veuillez réessayer.';
        }
        errorEl.style.display = 'block';
    }
    
    btn.disabled = false;
    btn.textContent = 'Soumettre la demande';
}

function toggleAdminFields() {
    const accountType = document.getElementById('accountType').value;
    const adminSecretField = document.getElementById('adminSecretField');
    const studentFields = document.getElementById('studentFields');
    const adminSecret = document.getElementById('adminSecret');
    const signupBtn = document.getElementById('signupBtn');
    const infoBox = document.querySelector('.info-box');
    
    if (accountType === 'admin') {
        adminSecretField.style.display = 'block';
        studentFields.style.display = 'none';
        adminSecret.required = true;
        
        // Make student fields not required
        document.getElementById('signupFiliere').required = false;
        document.getElementById('signupZalo').required = false;
        
        signupBtn.textContent = 'Créer le compte admin';
        infoBox.style.display = 'none';
    } else {
        adminSecretField.style.display = 'none';
        studentFields.style.display = 'block';
        adminSecret.required = false;
        
        // Make student fields required
        document.getElementById('signupFiliere').required = true;
        document.getElementById('signupZalo').required = true;
        
        signupBtn.textContent = 'Soumettre la demande';
        infoBox.style.display = 'block';
    }
}

// Check if already logged in
document.addEventListener('DOMContentLoaded', async function() {
    try {
        if (window.SupabaseDB && window.SupabaseDB.isAvailable()) {
            const user = await window.SupabaseDB.getCurrentUser();
            if (user) {
                // Already logged in, redirect
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            }
        }
    } catch (error) {
        console.error('Auth check error:', error);
    }
});
</script>
</body>
</html>
