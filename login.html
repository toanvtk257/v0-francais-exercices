<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;">
<title>fr_exercices_pack_v2 — Connexion</title>
<style>
:root{--brand:#2b5;--ink:#222;--muted:#666;--bg:#f7f7f7;--card:#fff}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{background:var(--card);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.1);padding:32px;max-width:400px;width:100%;margin:16px}
h1{margin:0 0 8px;font-size:1.6rem;color:var(--brand)}
.subtitle{color:var(--muted);margin-bottom:24px;font-size:.95rem}
.form-group{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-weight:600;color:var(--ink)}
input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:1rem;box-sizing:border-box}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,187,85,.1)}
.btns{display:flex;gap:10px;margin-top:24px}
button{flex:1;border:0;padding:12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:1rem;transition:all .2s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:#e0e0e0;color:#111}
.btn-secondary:hover{background:#d0d0d0}
.error{color:#d32f2f;font-size:.9rem;margin-top:6px;display:none}
.success{color:#388e3c;font-size:.9rem;margin-top:6px;display:none}
.toggle-form{text-align:center;margin-top:16px;font-size:.9rem}
.toggle-form a{color:var(--brand);cursor:pointer;text-decoration:underline}
.info-box{background:#f0f8ff;border:1px solid #cde;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.9rem;color:#333}
</style>
</head>
<body>
<div class="container">
  <h1>Entraînement au français - <em>espace numérique</em></h1>
  <p class="subtitle">Connexion à la plateforme</p>

  <!-- Login form -->
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="loginEmail">Email ou ID étudiant</label>
      <input type="text" id="loginEmail" name="email" placeholder="ex. etudiant@example.com" required autocomplete="off">
      <div class="error" id="loginError"></div>
    </div>
    <div class="form-group">
      <label for="loginPassword">Mot de passe</label>
      <input type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="new-password">
    </div>
    <div class="btns">
      <button type="submit" class="btn-primary" id="loginBtn">Connexion</button>
    </div>
  </form>

  <!-- Registration form (hidden by default) -->
  <form id="registerForm" style="display:none">
    <div class="info-box">
      Créez un compte pour commencer vos exercices de français.
    </div>
    <div class="form-group">
      <label for="regName">Nom complet</label>
      <input type="text" id="regName" name="name" placeholder="ex. Jean Dupont" required>
    </div>
    <div class="form-group">
      <label for="regEmail">Email ou ID étudiant</label>
      <input type="text" id="regEmail" name="email" placeholder="ex. jean@example.com" required>
      <div class="error" id="regError"></div>
    </div>
    <div class="form-group">
      <label for="regPassword">Mot de passe</label>
      <input type="password" id="regPassword" name="password" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label for="regPassword2">Confirmer mot de passe</label>
      <input type="password" id="regPassword2" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label for="regRole">Rôle</label>
      <select id="regRole" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:1rem">
        <option value="student">Étudiant</option>
        <option value="admin">Administrateur</option>
      </select>
    </div>
    <div class="form-group" id="securityCodeGroup" style="display:none">
      <label for="securityCode">Code de sécurité (requis pour administrateur)</label>
      <input type="text" id="securityCode" placeholder="Entrez le code de sécurité">
      <div class="error" id="securityCodeError"></div>
    </div>
    <div class="btns">
      <button type="submit" class="btn-primary" id="registerBtn">Créer un compte</button>
      <button type="button" class="btn-secondary" id="backToLogin">Retour</button>
    </div>
    <div class="success" id="regSuccess"></div>
  </form>

  <div class="toggle-form">
    <span id="toggleText">Pas encore de compte ? <a id="showRegister">S'inscrire</a></span>
  </div>
  
</div>

<script>
const $ = s => document.querySelector(s);
const AUTH_KEY = 'fr_auth_user';
const USERS_KEY = 'fr_users_db';
const ADMIN_SECURITY_CODE = '250784';
const STORAGE_KEY = 'fr_users_db';

function initUsersDB() {
  if (!localStorage.getItem(USERS_KEY)) {
    const defaultUsers = [
      { id: 'student1', name: 'Jean Dupont', email: 'jean@example.com', password: 'student123', role: 'student' }
    ];
    localStorage.setItem(USERS_KEY, JSON.stringify(defaultUsers));
  }
}

function getUsers() {
  const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
  return users;
}

function saveUsers(users) {
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}

async function handleLogin(e) {
  e.preventDefault();
  
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorDiv = document.getElementById('loginError');
  
  errorDiv.style.display = 'none';
  
  if (!email || !password) {
    errorDiv.textContent = 'Veuillez remplir tous les champs';
    errorDiv.style.display = 'block';
    return;
  }

  try {
    const formData = new FormData();
    formData.append('email', email);
    formData.append('password', password);

    const response = await fetch('/api/auth/login', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.success && data.redirectUrl) {
      // Use top-level window navigation
      window.top.location.href = data.redirectUrl;
    } else {
      errorDiv.textContent = data.error || 'Erreur de connexion';
      errorDiv.style.display = 'block';
    }
  } catch (error) {
    errorDiv.textContent = 'Erreur de connexion au serveur';
    errorDiv.style.display = 'block';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const errorDiv = document.getElementById('regError');
  
  errorDiv.style.display = 'none';
  
  if (!name || !email || !password) {
    errorDiv.textContent = 'Veuillez remplir tous les champs';
    errorDiv.style.display = 'block';
    return;
  }

  try {
    const formData = new FormData();
    formData.append('name', name);
    formData.append('email', email);
    formData.append('password', password);

    const response = await fetch('/api/auth/register', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.success && data.redirectUrl) {
      // Use top-level window navigation
      window.top.location.href = data.redirectUrl;
    } else {
      errorDiv.textContent = data.error || 'Erreur d\'inscription';
      errorDiv.style.display = 'block';
    }
  } catch (error) {
    errorDiv.textContent = 'Erreur de connexion au serveur';
    errorDiv.style.display = 'block';
  }
}

document.getElementById('regRole').addEventListener('change', (e) => {
  const securityCodeGroup = document.getElementById('securityCodeGroup');
  if (e.target.value === 'admin') {
    securityCodeGroup.style.display = 'block';
  } else {
    securityCodeGroup.style.display = 'none';
    document.getElementById('securityCode').value = '';
  }
});

document.getElementById('showRegister').addEventListener('click', () => {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('toggleText').style.display = 'none';
});

document.getElementById('backToLogin').addEventListener('click', () => {
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('toggleText').style.display = 'block';
  document.getElementById('registerForm').reset();
  document.getElementById('securityCodeGroup').style.display = 'none';
});

document.getElementById('loginForm').addEventListener('submit', handleLogin);
document.getElementById('registerForm').addEventListener('submit', handleRegister);

const currentUser = localStorage.getItem(AUTH_KEY);
if (currentUser) {
  try {
    const user = JSON.parse(currentUser);
    const redirectPage = user.role === 'admin' ? '/admin.html' : '/dashboard.html';
    window.location.href = redirectPage;
  } catch (error) {
    localStorage.removeItem(AUTH_KEY);
  }
}
</script>
</body>
</html>
