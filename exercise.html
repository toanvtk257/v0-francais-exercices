<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co ws: wss:; media-src 'self' https: blob:;">
<title>Exercice - Entraînement au français</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/config.js"></script>
<script src="lib/supabase-client.js"></script>
<style>
:root{--brand:#2b5;--ink:#222;--muted:#666;--bg:#f7f7f7;--card:#fff;--success:#4caf50;--error:#ef4444}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.header-left{display:flex;align-items:center;gap:16px}
.exercise-number{font-size:1.5rem;font-weight:700}
.timer{background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:6px;font-weight:600}
.back-btn{background:#fff;color:var(--brand);border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600}
main{max-width:900px;margin:24px auto;padding:0 16px 48px}
.card{background:var(--card);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:20px;margin-bottom:20px}
h2{margin:0 0 16px;font-size:1.2rem}
.consigne-box{background:#e0f2fe;border-left:4px solid #0ea5e9;padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px}
.consigne-box strong{color:#0369a1}
.consigne-text{white-space:pre-wrap;margin-top:8px;color:#0c4a6e}
.passage-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:20px;line-height:1.7}
.passage-title{font-weight:700;font-size:1.1rem;margin-bottom:12px;color:var(--ink)}
.passage-image{max-width:100%;border-radius:8px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.audio-box{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:16px;margin-bottom:20px}
.audio-box audio{width:100%;margin-top:8px}
.question{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:12px}
.question-header{font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between}
.question-text{margin-bottom:12px}
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid #e5e7eb;border-radius:6px;cursor:pointer;transition:all .2s}
.option:hover{border-color:#d1d5db;background:#f9fafb}
.option.selected{border-color:var(--brand);background:#ecfdf5}
.option.correct{border-color:var(--success);background:#dcfce7}
.option.incorrect{border-color:var(--error);background:#fee2e2}
.option input{margin:0}
.cloze-input{border:1px solid #d1d5db;padding:6px 10px;border-radius:4px;min-width:100px;font-size:1rem}
.cloze-input.correct{border-color:var(--success);background:#dcfce7}
.cloze-input.incorrect{border-color:var(--error);background:#fee2e2}
.btn-group{display:flex;gap:12px;margin-top:20px}
.btn{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:1rem}
.btn-primary{background:var(--brand);color:#fff}
.btn-secondary{background:#e5e7eb;color:#374151}
.btn:disabled{opacity:.5;cursor:not-allowed}
.results-box{background:#ecfdf5;border:2px solid var(--success);border-radius:8px;padding:20px;margin-top:20px;text-align:center}
.results-box.failed{background:#fef2f2;border-color:var(--error)}
.score{font-size:2rem;font-weight:700;color:var(--success)}
.results-box.failed .score{color:var(--error)}
.transcription-box{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:16px;margin-top:20px}
.transcription-box h3{margin:0 0 12px;color:#166534}
.loading{text-align:center;padding:40px;color:var(--muted)}
.error{text-align:center;padding:40px;color:var(--error)}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <span class="exercise-number" id="exerciseNumber">--</span>
    <span class="timer" id="timer">00:00</span>
  </div>
  <button class="back-btn" onclick="goBack()">Retour</button>
</header>

<main>
  <div id="exerciseContainer">
    <div class="loading">Chargement de l'exercice...</div>
  </div>
</main>

<script>
let currentExercise = null;
let userAnswers = {};
let timerInterval = null;
let elapsedSeconds = 0;
let isSubmitted = false;

async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const exerciseId = urlParams.get('id');
    
    if (!exerciseId) {
        showError('Aucun exercice spécifié');
        return;
    }
    
    try {
        // Wait for Supabase
        let retries = 0;
        while ((!window.SupabaseDB || !window.SupabaseDB.isAvailable()) && retries < 50) {
            await new Promise(resolve => setTimeout(resolve, 100));
            retries++;
        }
        
        if (!window.SupabaseDB || !window.SupabaseDB.isAvailable()) {
            throw new Error('Base de données non disponible');
        }
        
        // Load exercise
        currentExercise = await window.SupabaseDB.getExerciseById(exerciseId);
        
        if (!currentExercise) {
            throw new Error('Exercice non trouvé');
        }
        
        document.getElementById('exerciseNumber').textContent = currentExercise.titre || '--';
        renderExercise();
        startTimer();
        
    } catch (error) {
        console.error('Error loading exercise:', error);
        showError('Erreur: ' + error.message);
    }
}

function renderExercise() {
    const container = document.getElementById('exerciseContainer');
    const ex = currentExercise;
    
    let html = '';
    
    if (ex.consigne) {
        html += `
            <div class="card">
                <div class="consigne-box">
                    <strong>📋 Consigne:</strong>
                    <div class="consigne-text">${escapeHtml(ex.consigne)}</div>
                </div>
            </div>
        `;
    }
    
    if (ex.type === 'lecture') {
        html += '<div class="card">';
        html += '<h2>Texte à lire</h2>';
        html += '<div class="passage-box">';
        
        if (ex.image) {
            html += `<img src="${ex.image}" alt="Document à lire" class="passage-image">`;
        } else if (ex.texte) {
            // Only show text if there's no image
            html += `<div class="passage-text">${escapeHtml(ex.texte).replace(/\n/g, '<br>')}</div>`;
        }
        
        html += '</div></div>';
    } else if (ex.type === 'ecoute') {
        // Audio for CO exercises
        if (ex.audio) {
            html += `
                <div class="card">
                    <div class="audio-box">
                        <h2>🎧 Audio</h2>
                        <audio controls>
                            <source src="${ex.audio}" type="audio/mpeg">
                            Votre navigateur ne supporte pas l'audio.
                        </audio>
                    </div>
                </div>
            `;
        }
    } else if (ex.type === 'grammaire' || ex.type === 'lexique') {
        // For grammar/lexique, show text if present
        if (ex.texte) {
            html += `
                <div class="card">
                    <h2>Texte</h2>
                    <div class="passage-box">
                        <div class="passage-text">${escapeHtml(ex.texte).replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
            `;
        }
    }
    
    // Questions
    if (ex.questions && ex.questions.length > 0) {
        html += '<div class="card"><h2>Questions</h2>';
        
        ex.questions.forEach((q, idx) => {
            html += renderQuestion(q, idx);
        });
        
        html += `
            <div class="btn-group">
                <button class="btn btn-primary" id="submitBtn" onclick="submitAnswers()">Soumettre</button>
                <button class="btn btn-secondary" onclick="resetAnswers()">Réinitialiser</button>
            </div>
            <div id="resultsBox"></div>
        </div>`;
    }
    
    // Transcription box (hidden until submitted for CO)
    if (ex.type === 'ecoute' && ex.texte) {
        html += `
            <div id="transcriptionBox" class="transcription-box" style="display:none">
                <h3>📝 Transcription</h3>
                <p>${escapeHtml(ex.texte).replace(/\n/g, '<br>')}</p>
            </div>
        `;
    }
    
    container.innerHTML = html;
}

function renderQuestion(q, idx) {
    const qNum = idx + 1;
    const points = q.points || 1;
    
    let html = `
        <div class="question" data-index="${idx}">
            <div class="question-header">
                <span>${qNum}. ${escapeHtml(q.question || q.text || q.statement || '')}</span>
                <span class="text-muted">(${points} pts)</span>
            </div>
    `;
    
    if (q.type === 'qcm' || q.options) {
        // Multiple choice
        const options = q.options || [
            { text: q.a || q.choice_a, value: 'a' },
            { text: q.b || q.choice_b, value: 'b' },
            { text: q.c || q.choice_c, value: 'c' },
            q.d || q.choice_d ? { text: q.d || q.choice_d, value: 'd' } : null
        ].filter(o => o && o.text);
        
        html += '<div class="options">';
        options.forEach((opt, optIdx) => {
            const value = opt.value || String.fromCharCode(97 + optIdx);
            html += `
                <label class="option" data-value="${value}" onclick="selectOption(${idx}, '${value}')">
                    <input type="radio" name="q${idx}" value="${value}">
                    <span>${escapeHtml(opt.text || opt)}</span>
                </label>
            `;
        });
        html += '</div>';
    } else if (q.type === 'vf' || q.statement) {
        // True/False
        html += `
            <div class="options">
                <label class="option" data-value="vrai" onclick="selectOption(${idx}, 'vrai')">
                    <input type="radio" name="q${idx}" value="vrai">
                    <span>Vrai</span>
                </label>
                <label class="option" data-value="faux" onclick="selectOption(${idx}, 'faux')">
                    <input type="radio" name="q${idx}" value="faux">
                    <span>Faux</span>
                </label>
            </div>
        `;
    } else if (q.type === 'cloze' || q.clozeText) {
        // Fill in the blank
        const text = q.clozeText || q.text || '';
        let clozeHtml = text.replace(/\[([^\]]+)\]/g, (match, answer, offset) => {
            const inputId = `cloze_${idx}_${offset}`;
            return `<input type="text" class="cloze-input" id="${inputId}" data-answer="${answer}" onchange="saveClozeAnswer(${idx}, '${inputId}', this.value)">`;
        });
        html += `<div class="cloze-text">${clozeHtml}</div>`;
    }
    
    // Grammar explanation if exists
    if (q.explication) {
        html += `<div id="explication_${idx}" class="explication-box" style="display:none;margin-top:12px;padding:12px;background:#fef3c7;border-radius:6px;">
            <strong>💡 Explication:</strong> ${escapeHtml(q.explication)}
        </div>`;
    }
    
    html += '</div>';
    return html;
}

function selectOption(questionIdx, value) {
    if (isSubmitted) return;
    
    userAnswers[questionIdx] = value;
    
    // Update UI
    const question = document.querySelector(`.question[data-index="${questionIdx}"]`);
    question.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
        if (opt.dataset.value === value) {
            opt.classList.add('selected');
            opt.querySelector('input').checked = true;
        }
    });
}

function saveClozeAnswer(questionIdx, inputId, value) {
    if (!userAnswers[questionIdx]) userAnswers[questionIdx] = {};
    userAnswers[questionIdx][inputId] = value;
}

function resetAnswers() {
    if (isSubmitted) return;
    
    userAnswers = {};
    document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
        opt.querySelector('input').checked = false;
    });
    document.querySelectorAll('.cloze-input').forEach(input => {
        input.value = '';
    });
}

async function submitAnswers() {
    if (isSubmitted) return;
    
    isSubmitted = true;
    stopTimer();
    
    const questions = currentExercise.questions || [];
    let correct = 0;
    let total = questions.length;
    
    questions.forEach((q, idx) => {
        const userAnswer = userAnswers[idx];
        const correctAnswer = (q.answer || q.correct || q.ans || '').toString().toLowerCase();
        
        const questionEl = document.querySelector(`.question[data-index="${idx}"]`);
        
        if (q.type === 'cloze' || q.clozeText) {
            // Handle cloze questions
            const inputs = questionEl.querySelectorAll('.cloze-input');
            let allCorrect = true;
            inputs.forEach(input => {
                const expected = input.dataset.answer.toLowerCase().trim();
                const given = input.value.toLowerCase().trim();
                if (given === expected) {
                    input.classList.add('correct');
                } else {
                    input.classList.add('incorrect');
                    allCorrect = false;
                }
            });
            if (allCorrect) correct++;
        } else {
            // Handle QCM and VF
            const isCorrect = userAnswer && userAnswer.toLowerCase() === correctAnswer;
            
            questionEl.querySelectorAll('.option').forEach(opt => {
                if (opt.dataset.value === correctAnswer) {
                    opt.classList.add('correct');
                } else if (opt.dataset.value === userAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });
            
            if (isCorrect) correct++;
        }
        
        // Show explanation if exists
        const explEl = document.getElementById(`explication_${idx}`);
        if (explEl) explEl.style.display = 'block';
    });
    
    const percentage = Math.round((correct / Math.max(total, 1)) * 100);
    
    // Show results
    const resultsBox = document.getElementById('resultsBox');
    resultsBox.innerHTML = `
        <div class="results-box ${percentage >= 70 ? '' : 'failed'}">
            <div class="score">${percentage}%</div>
            <p>${correct} sur ${total} réponses correctes</p>
            <p>Temps: ${formatTime(elapsedSeconds)}</p>
        </div>
    `;
    
    // Show transcription for CO
    const transcriptionBox = document.getElementById('transcriptionBox');
    if (transcriptionBox) {
        transcriptionBox.style.display = 'block';
    }
    
    // Disable submit button
    document.getElementById('submitBtn').disabled = true;
    
    // Save progress
    try {
        const currentUser = await window.SupabaseDB.getCurrentUser();
        if (currentUser) {
            await window.SupabaseDB.saveProgress({
                user_id: currentUser.id,
                exercise_id: currentExercise.id,
                score: correct,
                total: total,
                percentage: percentage,
                time_spent: elapsedSeconds,
                answers: userAnswers
            });
        }
    } catch (error) {
        console.error('Error saving progress:', error);
    }
}

function startTimer() {
    timerInterval = setInterval(() => {
        elapsedSeconds++;
        document.getElementById('timer').textContent = formatTime(elapsedSeconds);
    }, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showError(message) {
    document.getElementById('exerciseContainer').innerHTML = `
        <div class="error">
            <p>${message}</p>
            <button class="btn btn-primary" onclick="goBack()">Retour</button>
        </div>
    `;
}

function goBack() {
    window.location.href = 'dashboard.html';
}

// Initialize
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
