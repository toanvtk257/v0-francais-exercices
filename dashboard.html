<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co ws: wss:;">
<title>Tableau de bord — Apprenant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#2b5;--ink:#222;--muted:#666;--bg:#f7f7f7;--card:#fff;--success:#4caf50;--warning:#ff9800}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.3rem}
.user-info{display:flex;flex-direction:column;align-items:flex-end;gap:4px;background:#fff;padding:12px 16px;border-radius:8px}
#userName{font-weight:600;color:#22c55e;font-size:.95rem}
.user-email{font-size:.85rem;color:#444}
.logout-btn{background:#22c55e;border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;margin-top:4px;transition:all .2s}
.logout-btn:hover{background:#1ea34a}
main{max-width:1200px;margin:24px auto;padding:0 16px 48px}
.card{background:var(--card);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.05);padding:20px;margin-bottom:20px}
h2{margin:0 0 16px;font-size:1.2rem;color:var(--ink)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-box{background:linear-gradient(135deg,var(--brand),#1a9d4d);color:#fff;padding:20px;border-radius:12px;text-align:center}
.stat-value{font-size:2rem;font-weight:700;margin:8px 0}
.stat-label{font-size:.9rem;opacity:.9}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:12px;border-bottom:1px solid #e0e0e0}
th{background:#f5f5f5;font-weight:600}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:.85rem;font-weight:600}
.badge-success{background:#e8f5e9;color:#2e7d32}
.badge-warning{background:#fff3e0;color:#e65100}
.badge-info{background:#e3f2fd;color:#1565c0}
.badge-new{background:#ef4444;color:#fff;font-weight:700}
.btn{display:inline-block;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-small{padding:6px 12px;font-size:.85rem}
.exercise-card{border:1px solid #e0e0e0;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;cursor:pointer}
.exercise-header{display:flex;flex-direction:column;gap:4px}
.exercise-info h3{margin:0 0 4px;font-size:1rem;display:flex;align-items:center;gap:8px}
.exercise-info p{margin:0;color:var(--muted);font-size:.9rem}
.exercise-meta{display:flex;gap:8px}
.text-muted{color:var(--muted);font-size:.875rem}
.empty-state{text-align:center;padding:40px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid #e0e0e0}
.tab-btn{background:none;border:none;padding:12px 16px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-content{display:none}
.tab-content.active{display:block}
.chart-container{height:200px;display:flex;align-items:center;justify-content:center;border:1px solid #e0e0e0;border-radius:8px}
.filter-selector{background:#fff;border:2px solid var(--brand);border-radius:8px;padding:12px;font-size:1rem;width:100%;cursor:pointer;font-weight:600;color:var(--ink);margin-bottom:20px}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:24px;padding:16px}
.pagination button{background:var(--brand);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;transition:all .2s}
.pagination button:hover:not(:disabled){opacity:.85}
.pagination button:disabled{background:#ccc;cursor:not-allowed;opacity:.6}
.pagination .page-info{font-weight:600;color:var(--ink);font-size:.95rem}
</style>
</head>
<body>
<header>
  <h1>🍀 Entraînement au français - <em>espace numérique</em></h1>
  <div class="user-info">
    <span id="userName">Chargement...</span>
    <span id="userEmail" class="user-email"></span>
    <button class="logout-btn" onclick="handleLogout()">Déconnexion</button>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('overview')">Vue d'ensemble</button>
    <button class="tab-btn" onclick="switchTab('exercises')">Exercices</button>
    <button class="tab-btn" onclick="switchTab('resources')">Ressources</button>
  </div>

  <!-- Overview Tab -->
  <div id="overview" class="tab-content active">
    <div class="card">
      <h2>Votre progression</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Leçons complétées</div>
          <div class="stat-value" id="statLessons">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Tentatives totales</div>
          <div class="stat-value" id="statAttempts">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Score moyen</div>
          <div class="stat-value" id="statAvgScore">0%</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Temps total</div>
          <div class="stat-value" id="statTime">0m</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Dernières tentatives</h2>
      <div id="recentAttempts">
        <div class="loading">Chargement...</div>
      </div>
    </div>
  </div>

  <!-- Exercises Tab -->
  <div id="exercises" class="tab-content">
    <div class="card" style="padding:16px">
      <label style="display:block;margin-bottom:8px;font-weight:600;color:var(--ink)">Choisissez une compétence et un niveau :</label>
      <select id="exerciseFilter" class="filter-selector" onchange="handleExerciseFilter()">
        <option value="">-- Sélectionnez --</option>
      </select>
    </div>
    
    <div class="card" id="filteredExercisesCard" style="display:none">
      <h2 id="filteredExercisesTitle">Exercices</h2>
      <div id="filteredExercises"><div class="empty-state">Veuillez sélectionner une compétence et un niveau ci-dessus</div></div>
      <div id="exercisePagination" class="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- Resources Tab -->
  <div id="resources" class="tab-content">
    <div class="card">
      <h2>Ressources externes</h2>
      <div id="resourcesList"><div class="loading">Chargement...</div></div>
      <div id="resourcePagination" class="pagination" style="display:none"></div>
    </div>
  </div>
</main>

<script src="lib/config.js"></script>
<script src="lib/supabase-client.js"></script>

<script>
// Global state
let currentUser = null;
let completedExercises = new Set();
let allExercises = [];
let allResources = [];
let currentExercisePage = 1;
let currentResourcePage = 1;
let filteredExercises = [];
const ITEMS_PER_PAGE = 10;

async function checkAuth() {
    try {
        let retries = 0;
        while ((!window.SupabaseDB || !window.SupabaseDB.isAvailable()) && retries < 50) {
            await new Promise(resolve => setTimeout(resolve, 100));
            retries++;
        }
        
        if (!window.SupabaseDB || !window.SupabaseDB.isAvailable()) {
            throw new Error('Base de données non disponible après 5 secondes');
        }
        
        currentUser = await window.SupabaseDB.getCurrentUser();
        
        if (!currentUser) {
            window.location.href = 'login.html';
            return;
        }
        
        // Update header
        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userEmail').textContent = currentUser.email;
        
        // Load all data
        await loadAllData();
        
    } catch (error) {
        console.error('Auth error:', error);
        window.location.href = 'login.html';
    }
}

async function handleLogout() {
    try {
        await window.SupabaseDB.logout();
        window.location.href = 'login.html';
    } catch (error) {
        console.error('Logout error:', error);
        window.location.href = 'login.html';
    }
}

async function loadAllData() {
    await Promise.all([
        loadStats(),
        loadExercises(),
        loadResources()
    ]);
}

async function loadStats() {
    try {
        const stats = await window.SupabaseDB.getStudentStats(currentUser.id);
        
        // Update stats display
        document.getElementById('statLessons').textContent = new Set(stats.recentAttempts.map(a => a.exercise_id)).size;
        document.getElementById('statAttempts').textContent = stats.totalAttempts;
        document.getElementById('statAvgScore').textContent = stats.averageScore + '%';
        
        // Calculate total time
        const totalMinutes = stats.recentAttempts.reduce((sum, a) => sum + (a.time_spent || 0), 0);
        document.getElementById('statTime').textContent = Math.round(totalMinutes / 60) + 'm';
        
        // Recent attempts
        const container = document.getElementById('recentAttempts');
        if (stats.recentAttempts.length === 0) {
            container.innerHTML = '<div class="empty-state">Aucune tentative pour le moment. Commencez un exercice!</div>';
        } else {
            container.innerHTML = `<table>
                <thead><tr><th>Exercice</th><th>Type</th><th>Score</th><th>Date</th></tr></thead>
                <tbody>
                    ${stats.recentAttempts.slice(0, 10).map(a => `
                        <tr>
                            <td>${a.exercises?.titre || 'N/A'}</td>
                            <td><span class="badge badge-info">${getTypeLabel(a.exercises?.type)}</span></td>
                            <td><span class="badge ${a.percentage >= 70 ? 'badge-success' : 'badge-warning'}">${a.percentage}%</span></td>
                            <td>${new Date(a.completed_at).toLocaleDateString('fr-FR')}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
        }
        
    } catch (error) {
        console.error('Error loading stats:', error);
    }
}

function getTypeLabel(type) {
    const labels = {
        lecture: 'CE',
        ecoute: 'CO',
        grammaire: 'Gram.',
        lexique: 'Lex.'
    };
    return labels[type] || type;
}

async function loadExercises() {
    try {
        const attempts = await window.SupabaseDB.getStudentStats(currentUser.id);
        completedExercises = new Set(attempts.recentAttempts.map(a => a.exercise_id));
        
        allExercises = await window.SupabaseDB.getExercises();
        buildExerciseFilterOptions();
        
    } catch (error) {
        console.error('Error loading exercises:', error);
    }
}

function buildExerciseFilterOptions() {
    const filterSelect = document.getElementById('exerciseFilter');
    
    const typeLabels = {
        'lecture': 'Compréhension Écrite (CE)',
        'ecoute': 'Compréhension Orale (CO)',
        'grammaire': 'Grammaire',
        'lexique': 'Lexique'
    };
    
    const levelOrder = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    
    const combinations = new Map();
    
    allExercises.forEach(ex => {
        const key = `${ex.type}-${ex.niveau}`;
        if (!combinations.has(key)) {
            combinations.set(key, {
                type: ex.type,
                niveau: ex.niveau,
                label: `${typeLabels[ex.type]} - ${ex.niveau}`,
                count: 0
            });
        }
        combinations.get(key).count++;
    });
    
    const sorted = Array.from(combinations.values()).sort((a, b) => {
        const typeOrder = ['lecture', 'ecoute', 'grammaire', 'lexique'];
        const typeCompare = typeOrder.indexOf(a.type) - typeOrder.indexOf(b.type);
        if (typeCompare !== 0) return typeCompare;
        return levelOrder.indexOf(a.niveau) - levelOrder.indexOf(b.niveau);
    });
    
    filterSelect.innerHTML = '<option value="">-- Sélectionnez --</option>' +
        sorted.map(opt => 
            `<option value="${opt.type}-${opt.niveau}">${opt.label} (${opt.count} exercice${opt.count > 1 ? 's' : ''})</option>`
        ).join('');
}

function handleExerciseFilter() {
    const filterValue = document.getElementById('exerciseFilter').value;
    const card = document.getElementById('filteredExercisesCard');
    const container = document.getElementById('filteredExercises');
    
    if (!filterValue) {
        card.style.display = 'none';
        container.innerHTML = '<div class="empty-state">Veuillez sélectionner une compétence et un niveau ci-dessus</div>';
        return;
    }
    
    const [type, niveau] = filterValue.split('-');
    
    filteredExercises = allExercises
        .filter(ex => ex.type === type && ex.niveau === niveau)
        .sort((a, b) => {
            // Extract numeric part from id if it exists (e.g., "lecture-1" -> 1)
            const numA = parseInt(a.id.match(/\d+/)?.[0] || '0');
            const numB = parseInt(b.id.match(/\d+/)?.[0] || '0');
            return numA - numB; // Ascending order: 1, 2, 3...
        });
    
    const typeLabels = {
        'lecture': 'Compréhension Écrite (CE)',
        'ecoute': 'Compréhension Orale (CO)',
        'grammaire': 'Grammaire',
        'lexique': 'Lexique'
    };
    
    document.getElementById('filteredExercisesTitle').textContent = 
        `${typeLabels[type]} - Niveau ${niveau}`;
    
    currentExercisePage = 1;
    card.style.display = 'block';
    renderPaginatedExercises();
}

function renderPaginatedExercises() {
    const container = document.getElementById('filteredExercises');
    const paginationContainer = document.getElementById('exercisePagination');
    
    if (filteredExercises.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucun exercice disponible</div>';
        paginationContainer.style.display = 'none';
        return;
    }
    
    const totalPages = Math.ceil(filteredExercises.length / ITEMS_PER_PAGE);
    const startIndex = (currentExercisePage - 1) * ITEMS_PER_PAGE;
    const endIndex = startIndex + ITEMS_PER_PAGE;
    const pageExercises = filteredExercises.slice(startIndex, endIndex);
    
    container.innerHTML = pageExercises.map(ex => {
        const isNew = !completedExercises.has(ex.id);
        const themeDisplay = ex.theme ? `<div style="color: #64748b; font-size: 0.875rem; margin-top: 4px;">Thème: ${ex.theme}</div>` : '';
        
        return `
            <div class="exercise-card" onclick="window.location.href='exercise.html?id=${ex.id}'">
                <div class="exercise-header">
                    <h3>
                        ${ex.titre}
                        ${isNew ? '<span class="badge-new">Nouveau</span>' : ''}
                    </h3>
                    ${themeDisplay}
                    <div class="exercise-meta">
                        <span class="badge badge-info">Niveau ${ex.niveau}</span>
                        <span class="text-muted">${ex.questions?.length || 0} questions</span>
                    </div>
                </div>
                <button class="btn btn-primary btn-small">Commencer</button>
            </div>
        `;
    }).join('');
    
    if (totalPages > 1) {
        paginationContainer.style.display = 'flex';
        paginationContainer.innerHTML = `
            <button onclick="changeExercisePage(${currentExercisePage - 1})" ${currentExercisePage === 1 ? 'disabled' : ''}>
                ← Précédent
            </button>
            <span class="page-info">Page ${currentExercisePage} sur ${totalPages}</span>
            <button onclick="changeExercisePage(${currentExercisePage + 1})" ${currentExercisePage === totalPages ? 'disabled' : ''}>
                Suivant →
            </button>
        `;
    } else {
        paginationContainer.style.display = 'none';
    }
}

function changeExercisePage(newPage) {
    const totalPages = Math.ceil(filteredExercises.length / ITEMS_PER_PAGE);
    if (newPage < 1 || newPage > totalPages) return;
    
    currentExercisePage = newPage;
    renderPaginatedExercises();
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startExercise(exerciseId) {
    localStorage.setItem('current_exercise_id', exerciseId);
    window.location.href = 'exercise.html?id=' + exerciseId;
}

async function loadResources() {
    const container = document.getElementById('resourcesList');
    
    try {
        const resources = await window.SupabaseDB.getResources();
        
        allResources = resources;
        currentResourcePage = 1;
        renderPaginatedResources();
        
    } catch (error) {
        console.error('Error loading resources:', error);
        container.innerHTML = '<div class="empty-state">Erreur de chargement: ' + error.message + '</div>';
    }
}

function renderPaginatedResources() {
    const container = document.getElementById('resourcesList');
    const paginationContainer = document.getElementById('resourcePagination');
    
    if (allResources.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucune ressource disponible</div>';
        paginationContainer.style.display = 'none';
        return;
    }
    
    const totalPages = Math.ceil(allResources.length / ITEMS_PER_PAGE);
    const startIndex = (currentResourcePage - 1) * ITEMS_PER_PAGE;
    const endIndex = startIndex + ITEMS_PER_PAGE;
    const pageResources = allResources.slice(startIndex, endIndex);
    
    container.innerHTML = pageResources.map(r => `
        <div class="exercise-card">
            <div class="exercise-info">
                <h3>${r.titre}</h3>
                <p>${r.description || 'Pas de description'} | ${r.categorie || 'Général'}</p>
            </div>
            <a href="${r.url}" target="_blank" class="btn btn-primary">Voir</a>
        </div>
    `).join('');
    
    if (totalPages > 1) {
        paginationContainer.style.display = 'flex';
        paginationContainer.innerHTML = `
            <button onclick="changeResourcePage(${currentResourcePage - 1})" ${currentResourcePage === 1 ? 'disabled' : ''}>
                ← Précédent
            </button>
            <span class="page-info">Page ${currentResourcePage} sur ${totalPages}</span>
            <button onclick="changeResourcePage(${currentResourcePage + 1})" ${currentResourcePage === totalPages ? 'disabled' : ''}>
                Suivant →
            </button>
        `;
    } else {
        paginationContainer.style.display = 'none';
    }
}

function changeResourcePage(newPage) {
    const totalPages = Math.ceil(allResources.length / ITEMS_PER_PAGE);
    if (newPage < 1 || newPage > totalPages) return;
    
    currentResourcePage = newPage;
    renderPaginatedResources();
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById(tab).classList.add('active');
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

document.addEventListener('DOMContentLoaded', checkAuth);
</script>
</body>
</html>
